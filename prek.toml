[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.6.8"

[[repos.hooks]]
id = "biome-check"
entry = "biome check"
stages = ["pre-commit"]
pass_filenames = false
always_run = true

[[repos]]
repo = "local"

[[repos.hooks]]
id = "tsc-rs"
name = "Type-check with tsc-rs"
entry = "tsc-rs --noEmit -p tsconfig.tests.json"
language = "node"
additional_dependencies = ["tsc-rs@0.8.0"]
files = '(\.[cm]?tsx?$|^tsconfig.*\.json$|^package(-lock)?\.json$)'
pass_filenames = false
stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.32.0"

[[repos.hooks]]
id = "zizmor"
args = ["--pedantic", "--fix", ".github"]
files = '^\.github/'
pass_filenames = false
